<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 신청 완료 | BYD 수원전시장</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #f5f7fa;
  font-family: Arial, sans-serif;
  color: #222;
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 45px 28px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.06);
}

.check {
  width: 70px;
  height: 70px;
  margin: 0 auto 25px;
  border-radius: 50%;
  background: #e8f5ed;
  color: #16834a;
  font-size: 38px;
  line-height: 70px;
}

h1 {
  font-size: 27px;
  line-height: 1.5;
  margin: 0;
}

.message {
  margin: 20px 0 30px;
  color: #666;
  font-size: 15px;
  line-height: 1.9;
}

.contact {
  padding: 20px;
  background: #f7f8fa;
  border-radius: 12px;
  line-height: 1.9;
}

.contact strong {
  display: block;
  font-size: 17px;
}

.contact a {
  color: #222;
  text-decoration: none;
  font-weight: bold;
}

.home {
  display: block;
  margin-top: 25px;
  padding: 16px;
  background: #172033;
  color: white;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
}

.note {
  margin-top: 20px;
  color: #999;
  font-size: 12px;
  line-height: 1.7;
}
</style>
</head>

<body>
<div class="card">

  <div class="check">✓</div>

  <h1>예약 신청이<br>완료되었습니다!</h1>

  <p class="message">
    BYD 수원전장을 이용해 주셔서 감사합니다.<br>
    신청 내용을 확인한 후<br>
    담당자가 빠르게 연락드리겠습니다.
  </p>

  <div class="contact">
    <strong>BYD 수원전시장 오은세</strong>
    <a href="tel:01024959456">010-2495-9456</a>
  </div>

  <a href="/" class="home">
  홈페이지로 돌아가기
</a>

  <p class="note">
    본 신청은 상담 요청이며<br>
    방문 날짜와 시간은 담당자 확인 후 확정됩니다.
  </p>

</div>
</body>
</html>
